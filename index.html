<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>NOVATERRA IMAGE ARCHIVE</title>
  <style>
    :root {
      --bg: #040813;
      --panel: rgba(8, 18, 35, .94);
      --panel-2: rgba(12, 27, 50, .88);
      --line: rgba(80, 180, 255, .48);
      --line-strong: rgba(103, 208, 255, .85);
      --text: #eef7ff;
      --muted: #8fa8be;
      --cyan: #6dd9ff;
      --blue: #568cff;
      --violet: #a76cff;
      --danger: #ff6d88;
      --header-h: 76px;
      --sidebar-w: 268px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% -10%, rgba(86, 140, 255, .18), transparent 32%),
        radial-gradient(circle at 100% 0%, rgba(167, 108, 255, .15), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    button, input, select { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 13px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(4, 8, 19, .88);
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
    }

    .brand {
      min-width: max-content;
    }
    .brand strong {
      display: block;
      font-size: 17px;
      letter-spacing: .16em;
      color: var(--cyan);
      text-shadow: 0 0 16px rgba(109, 217, 255, .45);
    }
    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 760px;
    }
    .search-wrap::before {
      content: "⌕";
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-53%);
      color: var(--cyan);
      font-size: 23px;
      pointer-events: none;
    }
    #search {
      width: 100%;
      height: 46px;
      padding: 0 45px 0 46px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(8, 18, 35, .95);
      color: var(--text);
      outline: none;
      transition: .2s ease;
    }
    #search:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 3px rgba(80, 180, 255, .1), 0 0 20px rgba(80, 180, 255, .12);
    }
    #clearSearch {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    #clearSearch:hover { color: var(--text); background: rgba(255,255,255,.06); }

    .menu-btn {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--cyan);
      cursor: pointer;
    }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      min-height: calc(100vh - var(--header-h));
    }

    .sidebar {
      position: sticky;
      top: var(--header-h);
      height: calc(100vh - var(--header-h));
      padding: 14px 12px 28px;
      overflow-y: auto;
      border-right: 1px solid rgba(80, 180, 255, .25);
      background: rgba(5, 11, 23, .73);
      scrollbar-width: thin;
      scrollbar-color: rgba(109,217,255,.38) transparent;
    }
    .sidebar-title {
      padding: 6px 10px 11px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .13em;
    }
    .category-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 3px 0;
      padding: 10px 11px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #b8cbda;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: .16s ease;
    }
    .category-btn:hover {
      color: var(--text);
      background: rgba(80, 180, 255, .07);
      border-color: rgba(80, 180, 255, .16);
    }
    .category-btn.active {
      color: #fff;
      border-color: rgba(109, 217, 255, .55);
      background: linear-gradient(90deg, rgba(47, 139, 220, .22), rgba(139, 83, 255, .11));
      box-shadow: inset 3px 0 0 var(--cyan), 0 0 14px rgba(80, 180, 255, .08);
    }
    .category-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }
    .category-count {
      flex: 0 0 auto;
      min-width: 27px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    .main {
      min-width: 0;
      padding: 22px 24px 42px;
    }

    .summary {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 17px;
    }
    .summary h1 {
      margin: 0;
      font-size: clamp(21px, 2vw, 30px);
      letter-spacing: -.02em;
    }
    .summary p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .summary-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .select {
      height: 38px;
      padding: 0 34px 0 12px;
      border: 1px solid rgba(80,180,255,.3);
      border-radius: 10px;
      color: var(--text);
      background: var(--panel);
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(80, 180, 255, .22);
      border-radius: 15px;
      background: linear-gradient(180deg, rgba(12, 27, 50, .94), rgba(6, 14, 27, .97));
      box-shadow: 0 12px 34px rgba(0,0,0,.24);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(109,217,255,.62);
      box-shadow: 0 16px 38px rgba(0,0,0,.34), 0 0 24px rgba(80,180,255,.09);
    }

    .image-box {
      position: relative;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background:
        linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%),
        linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%),
        #07101f;
      background-position: 0 0, 12px 12px;
      background-size: 24px 24px;
      cursor: zoom-in;
    }
    .image-box img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .25s ease;
    }
    .card:hover .image-box img { transform: scale(1.025); }
    .image-box.contain img { object-fit: contain; }
    .broken {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      background: linear-gradient(135deg, rgba(255,109,136,.07), rgba(80,180,255,.04));
    }
    .image-box.is-broken .broken { display: grid; }
    .image-box.is-broken img { display: none; }

    .card-body { padding: 12px; }
    .file-name {
      min-height: 40px;
      margin: 0;
      color: #f4f9ff;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-all;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 10px;
    }
    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 11px;
    }
    .small-btn {
      min-width: 0;
      height: 34px;
      padding: 0 8px;
      overflow: hidden;
      border: 1px solid rgba(80,180,255,.28);
      border-radius: 9px;
      color: #cfeeff;
      background: rgba(80,180,255,.07);
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .small-btn:hover {
      border-color: rgba(109,217,255,.66);
      background: rgba(80,180,255,.14);
    }

    .empty {
      display: none;
      padding: 80px 20px;
      color: var(--muted);
      text-align: center;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 26px;
    }
    .page-btn {
      min-width: 40px;
      height: 40px;
      padding: 0 13px;
      border: 1px solid rgba(80,180,255,.3);
      border-radius: 10px;
      color: var(--text);
      background: var(--panel);
      cursor: pointer;
    }
    .page-btn:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: rgba(80,180,255,.12);
    }
    .page-btn:disabled { opacity: .35; cursor: default; }
    .page-info { color: var(--muted); font-size: 12px; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 4, 12, .88);
      backdrop-filter: blur(14px);
    }
    .modal.open { display: flex; }
    .modal-content {
      position: relative;
      width: min(1280px, 96vw);
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(109,217,255,.48);
      border-radius: 18px;
      background: #050b16;
      box-shadow: 0 28px 90px rgba(0,0,0,.7), 0 0 34px rgba(80,180,255,.1);
    }
    .modal-image-wrap {
      min-height: 0;
      flex: 1;
      display: grid;
      place-items: center;
      background: #02050b;
    }
    #modalImage {
      max-width: 100%;
      max-height: calc(94vh - 72px);
      object-fit: contain;
    }
    .modal-footer {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
      border-top: 1px solid rgba(80,180,255,.22);
    }
    #modalName {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 750;
    }
    .close-btn {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      color: #fff;
      background: rgba(255,255,255,.06);
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 200;
      transform: translate(-50%, 20px);
      padding: 11px 16px;
      border: 1px solid rgba(109,217,255,.44);
      border-radius: 11px;
      color: #eaf9ff;
      background: rgba(8,18,35,.96);
      box-shadow: 0 12px 34px rgba(0,0,0,.45);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 860px) {
      :root { --header-h: 132px; }
      .topbar {
        flex-wrap: wrap;
        gap: 9px;
        padding: 10px 13px;
      }
      .brand { flex: 1; }
      .menu-btn { display: block; }
      .search-wrap { order: 3; flex-basis: 100%; max-width: none; }
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        top: var(--header-h);
        left: 0;
        bottom: 0;
        z-index: 45;
        width: min(84vw, var(--sidebar-w));
        height: auto;
        transform: translateX(-105%);
        transition: transform .22s ease;
        background: rgba(4,9,20,.98);
        box-shadow: 18px 0 50px rgba(0,0,0,.5);
      }
      .sidebar.open { transform: translateX(0); }
      .main { padding: 18px 13px 38px; }
      .summary { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
      .card-body { padding: 10px; }
      .file-name { font-size: 13px; }
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .card-actions { grid-template-columns: 1fr; }
      .summary-actions { width: 100%; }
      .select { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="카테고리 열기">☰</button>
    <div class="brand">
      <strong>NOVATERRA ARCHIVE</strong>
      <span>GITHUB IMAGE DATABASE VIEWER</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="이미지 ID 또는 카테고리 검색" autocomplete="off">
      <button id="clearSearch" type="button" aria-label="검색어 지우기">✕</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">IMAGE CATEGORIES</div>
      <nav id="categoryNav"></nav>
    </aside>

    <main class="main">
      <section class="summary">
        <div>
          <h1 id="currentTitle">전체 이미지</h1>
          <p id="resultText">목록을 불러오는 중...</p>
        </div>
        <div class="summary-actions">
          <select id="fitMode" class="select" aria-label="이미지 맞춤 방식">
            <option value="cover">카드 가득 채우기</option>
            <option value="contain">전체 이미지 보기</option>
          </select>
          <select id="pageSize" class="select" aria-label="페이지당 표시 수">
            <option value="30">30개씩</option>
            <option value="60" selected>60개씩</option>
            <option value="120">120개씩</option>
          </select>
        </div>
      </section>

      <section class="grid" id="grid"></section>
      <div class="empty" id="empty">검색 결과가 없어 👀</div>

      <div class="pagination" id="pagination">
        <button class="page-btn" id="prevPage" type="button">이전</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="page-btn" id="nextPage" type="button">다음</button>
      </div>
    </main>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
    <div class="modal-content">
      <div class="modal-image-wrap">
        <img id="modalImage" alt="">
      </div>
      <div class="modal-footer">
        <span id="modalName"></span>
        <button class="close-btn" id="closeModal" type="button" aria-label="닫기">✕</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">복사 완료</div>

      page: 1,
      pageSize: 60,
      fit: "cover"
    };

    const el = {
      nav: document.getElementById("categoryNav"),
      grid: document.getElementById("grid"),
      title: document.getElementById("currentTitle"),
      result: document.getElementById("resultText"),
      empty: document.getElementById("empty"),
      pagination: document.getElementById("pagination"),
      prev: document.getElementById("prevPage"),
      next: document.getElementById("nextPage"),
      pageInfo: document.getElementById("pageInfo"),
      search: document.getElementById("search"),
      clearSearch: document.getElementById("clearSearch"),
      pageSize: document.getElementById("pageSize"),
      fitMode: document.getElementById("fitMode"),
      sidebar: document.getElementById("sidebar"),
      menuBtn: document.getElementById("menuBtn"),
      modal: document.getElementById("modal"),
      modalImage: document.getElementById("modalImage"),
      modalName: document.getElementById("modalName"),
      closeModal: document.getElementById("closeModal"),
      toast: document.getElementById("toast")
    };

    function categoryButton(value, label, count) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "category-btn";
      button.dataset.category = value;
      button.innerHTML = `
        <span class="category-label">${escapeHtml(label)}</span>
        <span class="category-count">${count}</span>
      `;
      button.addEventListener("click", () => {
        state.category = value;
        state.page = 1;
        el.sidebar.classList.remove("open");
        render();
      });
      return button;
    }

    function buildNavigation() {
      el.nav.replaceChildren();
      el.nav.appendChild(categoryButton("all", "전체 이미지", allItems.length));
      for (const category of categories) {
        const number = String(category.number).padStart(2, "0");
        el.nav.appendChild(
          categoryButton(String(category.number), `${number}. ${category.name}`, category.items.length)
        );
      }
    }

    function getFilteredItems() {
      const query = state.query.trim().toLocaleLowerCase("ko");
      let items = state.category === "all"
        ? allItems
        : (categories.find(c => String(c.number) === state.category)?.items || []);

      if (!query) return items;

      return items.filter(item =>
        item.id.toLocaleLowerCase("ko").includes(query) ||
        item.baseId.toLocaleLowerCase("ko").includes(query) ||
        item.categoryName.toLocaleLowerCase("ko").includes(query) ||
        String(item.categoryNumber).includes(query)
      );
    }

    function createCard(item) {
      const article = document.createElement("article");
      article.className = "card";

      const box = document.createElement("div");
      box.className = "image-box" + (state.fit === "contain" ? " contain" : "");
      box.title = "클릭해서 크게 보기";

      const img = document.createElement("img");
      const url = imageUrl(item.id);
      img.src = url;
      img.alt = item.id;
      img.loading = "lazy";
      img.decoding = "async";
      img.addEventListener("error", () => box.classList.add("is-broken"));
      img.addEventListener("click", () => openModal(item.id, url));

      const broken = document.createElement("div");
      broken.className = "broken";
      broken.innerHTML = `<div>이미지를 불러오지 못했어<br><strong>${escapeHtml(item.id)}.png</strong></div>`;

      box.append(img, broken);

      const body = document.createElement("div");
      body.className = "card-body";
      body.innerHTML = `
        <p class="file-name">${escapeHtml(item.id)}</p>
        <div class="meta">
          <span>${String(item.categoryNumber).padStart(2, "0")}. ${escapeHtml(item.categoryName)}</span>
          ${item.state ? `<span>${escapeHtml(item.state)}</span>` : ""}
        </div>
        <div class="card-actions">
          <button class="small-btn copy-id" type="button">ID 복사</button>
          <button class="small-btn copy-md" type="button">마크다운 복사</button>
        </div>
      `;

      body.querySelector(".copy-id").addEventListener("click", () => copyText(item.id, "이미지 ID 복사 완료"));
      body.querySelector(".copy-md").addEventListener("click", () => {
        copyText(`![${item.id}](${url})`, "마크다운 복사 완료");
      });

      article.append(box, body);
      return article;
    }

    function render() {
      const filtered = getFilteredItems();
      const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
      if (state.page > totalPages) state.page = totalPages;

      const start = (state.page - 1) * state.pageSize;
      const visible = filtered.slice(start, start + state.pageSize);

      const selectedCategory = state.category === "all"
        ? null
        : categories.find(c => String(c.number) === state.category);

      el.title.textContent = selectedCategory
        ? `${String(selectedCategory.number).padStart(2, "0")}. ${selectedCategory.name}`
        : "전체 이미지";

      const queryLabel = state.query.trim() ? ` · “${state.query.trim()}” 검색` : "";
      el.result.textContent = `${filtered.length.toLocaleString()}개 이미지${queryLabel} · 총 ${allItems.length.toLocaleString()}개 등록`;

      document.querySelectorAll(".category-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.category === state.category);
      });

      el.grid.replaceChildren(...visible.map(createCard));
      el.empty.style.display = filtered.length ? "none" : "block";
      el.pagination.style.display = filtered.length ? "flex" : "none";
      el.pageInfo.textContent = `${state.page.toLocaleString()} / ${totalPages.toLocaleString()} 페이지`;
      el.prev.disabled = state.page <= 1;
      el.next.disabled = state.page >= totalPages;

      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function openModal(name, url) {
      el.modalImage.src = url;
      el.modalImage.alt = name;
      el.modalName.textContent = name;
      el.modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      el.modal.classList.remove("open");
      el.modalImage.src = "";
      document.body.style.overflow = "";
    }

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
      showToast(message);
    }

    let toastTimer;
    function showToast(message) {
      el.toast.textContent = message;
      el.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.toast.classList.remove("show"), 1400);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    let searchTimer;
    el.search.addEventListener("input", event => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.query = event.target.value;
        state.page = 1;
        render();
      }, 130);
    });

    el.clearSearch.addEventListener("click", () => {
      el.search.value = "";
      state.query = "";
      state.page = 1;
      el.search.focus();
      render();
    });

    el.pageSize.addEventListener("change", event => {
      state.pageSize = Number(event.target.value);
      state.page = 1;
      render();
    });

    el.fitMode.addEventListener("change", event => {
      state.fit = event.target.value;
      render();
    });

    el.prev.addEventListener("click", () => {
      if (state.page > 1) {
        state.page -= 1;
        render();
      }
    });

    el.next.addEventListener("click", () => {
      const total = Math.ceil(getFilteredItems().length / state.pageSize);
      if (state.page < total) {
        state.page += 1;
        render();
      }
    });

    el.menuBtn.addEventListener("click", () => el.sidebar.classList.toggle("open"));
    el.closeModal.addEventListener("click", closeModal);
    el.modal.addEventListener("click", event => {
      if (event.target === el.modal) closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    buildNavigation();
    render();
  </script>
</body>
</html>
